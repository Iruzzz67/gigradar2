<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="sukataniBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#142416"/>
      <stop offset="100%" stop-color="#060c07"/>
    </radialGradient>
    <linearGradient id="taniGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="10" y="10" width="180" height="180" rx="36" fill="url(#sukataniBg)" stroke="#22c55e" stroke-width="3" stroke-opacity="0.8"/>

  <!-- Mountain Slamet Silhouette & Wheat/Padi Motif -->
  <path d="M50,94 L82,60 L100,74 L124,52 L150,94 Z" fill="none" stroke="#22c55e" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Electro Bolt & Sickle hybrid in center -->
  <path d="M100,42 L104,70 L94,70 L104,96 L88,78 L98,78 Z" fill="#b7ff00"/>

  <!-- Stencil Padi / Agrarian Leaves -->
  <path d="M72,88 Q62,76 68,64 Q76,74 72,88 Z" fill="#4ade80"/>
  <path d="M128,88 Q138,76 132,64 Q124,74 128,88 Z" fill="#4ade80"/>

  <!-- Raw Stencil Typography SUKATANI -->
  <text x="100" y="132" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="24" letter-spacing="3" fill="#ffffff">
    SUKATANI
  </text>

  <!-- Tagline / Collective -->
  <rect x="36" y="142" width="128" height="16" rx="4" fill="#22c55e" fill-opacity="0.2"/>
  <text x="100" y="154" text-anchor="middle" font-family="'Courier New', monospace" font-weight="800" font-size="8.5" letter-spacing="2" fill="#4ade80">
    HARVESTMIND COLLECTIVE
  </text>

  <text x="100" y="173" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="7.5" letter-spacing="2" fill="#71717a">
    PURBALINGGA • ELECTRO-PUNK
  </text>
</svg>
