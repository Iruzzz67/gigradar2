  <!-- Background Badge -->
  <rect x="10" y="10" width="180" height="180" rx="36" fill="url(#fstvlstBg)" stroke="#ccff00" stroke-width="3" stroke-opacity="0.8"/>
  
  <!-- Iconic Farid Stevy Equal Sign '=' / FSTVLST II -->
  <rect x="52" y="44" width="96" height="20" rx="4" fill="url(#fstvlstNeon)"/>
  <rect x="52" y="74" width="96" height="20" rx="4" fill="url(#fstvlstNeon)"/>

