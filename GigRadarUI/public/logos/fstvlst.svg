      <stop offset="0%" stop-color="#1f2214"/>
      <stop offset="100%" stop-color="#0a0c06"/>
    </radialGradient>
    <linearGradient id="fstvlstNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ccff00"/>
      <stop offset="100%" stop-color="#a6e22e"/>
    </linearGradient>
