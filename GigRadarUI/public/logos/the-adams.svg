<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="adamsBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#122533"/>
      <stop offset="100%" stop-color="#070e14"/>
    </radialGradient>
    <linearGradient id="adamsSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="10" y="10" width="180" height="180" rx="36" fill="url(#adamsBg)" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.8"/>

  <!-- Retro Vinyl Grooves / Wave ring -->
  <circle cx="100" cy="80" r="44" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>
  <circle cx="100" cy="80" r="34" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="100" cy="80" r="16" fill="#070e14" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="100" cy="80" r="5" fill="#fef08a"/>

  <!-- Iconic Retro Script Wordmark "The Adams" -->
  <text x="100" y="138" text-anchor="middle" font-family="'Brush Script MT', 'Arial Rounded MT Bold', 'Trebuchet MS', cursive, sans-serif" font-weight="900" font-size="28" letter-spacing="1" fill="#fef08a">
    The Adams
  </text>

  <!-- Subtitle -->
  <text x="100" y="157" text-anchor="middle" font-family="'Helvetica Neue', 'Arial', sans-serif" font-weight="800" font-size="8.5" letter-spacing="3" fill="#38bdf8">
    POWER POP • JAKARTA
  </text>
  <text x="100" y="173" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="7.5" letter-spacing="2" fill="#64748b">
    EST 2002 • AGTERPLAAS
  </text>
</svg>
