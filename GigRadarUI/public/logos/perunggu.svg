<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="perungguBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1e12"/>
      <stop offset="100%" stop-color="#0c0906"/>
    </radialGradient>
    <linearGradient id="bronzeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="10" y="10" width="180" height="180" rx="36" fill="url(#perungguBg)" stroke="url(#bronzeGold)" stroke-width="3" stroke-opacity="0.8"/>

  <!-- Corporate Seal Ring Motif (Memorandum Style) -->
  <circle cx="100" cy="80" r="42" fill="none" stroke="url(#bronzeGold)" stroke-width="2" stroke-opacity="0.85"/>
  <circle cx="100" cy="80" r="36" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.6"/>

  <!-- Stylized Monogram P / Clock / Office Icon inside seal -->
  <path d="M92,60 L108,60 C114,60 118,64 118,70 C118,76 114,80 108,80 L92,80 Z M92,54 L92,106" 
        stroke="url(#bronzeGold)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Star accents -->
  <polygon points="76,80 78,82 76,84 74,82" fill="#f59e0b"/>
  <polygon points="124,80 126,82 124,84 122,82" fill="#f59e0b"/>

  <!-- Elegant Serif Wordmark PERUNGGU -->
  <text x="100" y="142" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-weight="900" font-size="22" letter-spacing="4" fill="#ffffff">
    PERUNGGU
  </text>

  <!-- Subtitle Memo Style -->
  <text x="100" y="159" text-anchor="middle" font-family="'Trebuchet MS', 'Arial', sans-serif" font-weight="700" font-size="8.5" letter-spacing="2.5" fill="#f59e0b">
    ROCK PULANG KANTOR
  </text>
  <text x="100" y="174" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="7.5" letter-spacing="2" fill="#78716c">
    JAKARTA • MEMORANDUM
  </text>
</svg>
